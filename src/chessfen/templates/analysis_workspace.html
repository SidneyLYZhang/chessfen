<p class="field-hint" data-workspace-status role="status" aria-live="polite" hidden></p>
<div class="analysis-workspace-restore" data-workspace-restore hidden>
  <p class="field-hint" data-workspace-restore-message>{% trans %}A locally saved Analysis Workspace is available.{% endtrans %}</p>
  <div class="form-actions">
    <button class="secondary-button" type="button" data-workspace-restore-button>{% trans %}Restore Analysis Workspace{% endtrans %}</button>
    <button class="ghost-button" type="button" data-workspace-discard-button>{% trans %}Discard Analysis Workspace{% endtrans %}</button>
  </div>
</div>
