<!doctype html>
<html lang="{{ locale }}">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}ChessFEN{% endblock %}</title>
  <link rel="stylesheet" href="/static/css/app.css">
</head>
<body>
  <header class="site-header">
    <div class="container header-inner">
      <a class="brand" href="/">ChessFEN</a>
      <nav class="lang-switch" aria-label="{% trans %}Language{% endtrans %}">
        {% for code, label in locales %}
        <a href="/lang/{{ code }}?next={{ next_path|urlencode }}"{% if code == locale %} class="active" aria-current="true"{% endif %}>{{ label }}</a>
        {% endfor %}
      </nav>
    </div>
  </header>
  <main class="container">
    {% block content %}{% endblock %}
  </main>
  <footer class="site-footer">
    <div class="container">{% trans %}Open source under MIT{% endtrans %} · <a href="https://github.com/SidneyLYZhang/chessfen">GitHub</a></div>
  </footer>
  <script>
    (function () {
      function copyText(text) {
        if (navigator.clipboard && window.isSecureContext) {
          return navigator.clipboard.writeText(text);
        }
        var area = document.createElement("textarea");
        area.value = text;
        area.style.position = "fixed";
        area.style.opacity = "0";
        document.body.appendChild(area);
        area.select();
        try { document.execCommand("copy"); } catch (error) { /* ignore */ }
        document.body.removeChild(area);
        return Promise.resolve();
      }
      document.addEventListener("click", function (event) {
        if (!(event.target instanceof Element)) { return; }
        var button = event.target.closest("[data-copy-target]");
        if (!button) { return; }
        var target = document.getElementById(button.getAttribute("data-copy-target"));
        if (!target) { return; }
        copyText(target.textContent.trim()).then(function () {
          var original = button.getAttribute("data-copy-label") || button.textContent;
          button.setAttribute("data-copy-label", original);
          button.textContent = button.getAttribute("data-copied-label") || original;
          setTimeout(function () { button.textContent = original; }, 1500);
        });
      });
    })();
  </script>
</body>
</html>
